name: Hostinger CLI Deploy

on:
  push:
    branches:
      - codex/hostinger-cli-run
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Bundle
        run: npm run build

      - name: Deploy via Hostinger CLI
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_DOMAIN: luxuryuilib.com
          HOSTINGER_STATIC_PATH: ./dist
        run: node scripts/hostinger-mcp-deploy.mjs
