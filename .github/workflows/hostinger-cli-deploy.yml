name: Hostinger CLI Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Validate Build Output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi

      - name: Create deployment archive (excluding CDN assets)
        run: |
          cd dist && zip -r /tmp/dist.zip . -x 'assets/apps/*'
          echo "Archive size: $(du -sh /tmp/dist.zip | cut -f1)"

      - name: Deploy via Hostinger CLI
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_DOMAIN: luxuryuilib.com
          HOSTINGER_STATIC_PATH: /tmp/dist.zip
        run: node scripts/hostinger-mcp-deploy.mjs
