name: Hostinger CLI Deploy

on:
  push:
    branches:
      - codex/hostinger-cli-run
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Create Timestamped Static Archive
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          ARCHIVE_NAME="luxuryui_$(date -u +%Y%m%d_%H%M%S).zip"
          cd dist
          zip -r "../${ARCHIVE_NAME}" .
          echo "HOSTINGER_STATIC_PATH=./${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Deploy via Hostinger CLI
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_DOMAIN: luxuryuilib.com
        run: node scripts/hostinger-mcp-deploy.mjs
