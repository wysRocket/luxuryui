name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build
        env:
          VITE_BACKEND_MODE: ${{ secrets.VITE_BACKEND_MODE }}
          VITE_PAYMENT_MODE: ${{ secrets.VITE_PAYMENT_MODE }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_GOOGLE_AUTH_ENABLED: ${{ secrets.VITE_FIREBASE_GOOGLE_AUTH_ENABLED }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: npm run build

      - name: Create deployment archive (excluding CDN assets)
        run: |
          cd dist && zip -r /tmp/dist.zip . -x 'assets/apps/*'
          echo "Archive size: $(du -sh /tmp/dist.zip | cut -f1)"

      - name: Deploy
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          ARCHIVE_PATH: /tmp/dist.zip
        run: node scripts/deploy.mjs
