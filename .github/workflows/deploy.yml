name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Create deployment archive (excluding CDN assets)
        run: |
          cd dist && zip -r /tmp/dist.zip . -x 'assets/apps/*'
          echo "Archive size: $(du -sh /tmp/dist.zip | cut -f1)"

      - name: Deploy
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          ARCHIVE_PATH: /tmp/dist.zip
        run: node scripts/deploy.mjs
